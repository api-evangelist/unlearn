aid: unlearn
name: Unlearn
description: >-
  Unlearn is a San Francisco AI company that builds digital twin generators for
  clinical trials — machine learning models trained on patient-level historical
  data that forecast an individual participant's clinical outcomes under control
  or standard of care. Sponsors use these AI-generated digital twins to plan
  trials, monitor clinical data, and run smaller, more powerful studies; the
  approach is qualified by the EMA and aligned with current FDA guidance.
  Unlearn is backed by 8VC and DCVC and publishes no public developer API.
